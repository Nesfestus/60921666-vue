server {
    listen 80;
    server_name cinemavoid.space www.cinemavoid.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cinemavoid.space www.cinemavoid.space;

    ssl_certificate /etc/letsencrypt/live/cinemavoid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinemavoid.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 5m;

    location /api/ {
        include fastcgi_params;
        fastcgi_pass cinema-backend-fpm:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
