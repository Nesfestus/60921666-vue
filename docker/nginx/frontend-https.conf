server {
    listen 80;
    server_name cinemavoid.space www.cinemavoid.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cinemavoid.space www.cinemavoid.space;

    ssl_certificate /etc/letsencrypt/live/cinemavoid.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinemavoid.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://cinema-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
